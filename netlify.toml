[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/functions-internal,.lovable/mcp/manifest.json"
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_API_KEY,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY"
  SECRETS_SCAN_ENABLED = "false"
